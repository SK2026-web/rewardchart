function dlg(msg,def,ok){var d=document.createElement('div');d.className='wow';d.style.fontFamily="'Nunito',system-ui,sans-serif";
 d.innerHTML='<div class="panel" style="color:var(--fg);max-width:340px;cursor:default;font-size:18px"><p style="margin:0 0 12px"></p>'+(def!==null?'<input style="font:inherit;width:100%;padding:10px;margin-bottom:12px;border-radius:8px" inputmode="decimal">':'')+'<button class="btn go" data-y>OK</button> <button class="btn" data-n>Cancel</button></div>';
 d.querySelector('p').textContent=msg;var inp=d.querySelector('input');if(inp)inp.value=def;
 d.onclick=function(e){if(e.target.hasAttribute('data-y')){d.remove();ok(inp?inp.value:null)}else if(e.target.hasAttribute('data-n')||e.target===d)d.remove()};document.body.appendChild(d);if(inp)inp.focus()}
function render(){
 var app=document.getElementById('app');
 if(!cur){document.body.className='';
  app.innerHTML='<div class="pick"><h1 class="hf">Who’s playing?</h1><p>Finish chores, show kindness, level up.</p><button class="who h" data-a="pick" data-k="heath"><span>⛏️🧱</span>Heath</button><button class="who f" data-a="pick" data-k="fletcher"><span>🏍️🚛</span>Fletcher</button></div>';return}
 var K=KIDS[cur],st=S[cur],X=xp(cur),lv=Math.floor(X/100)+1,title=K.titles[Math.min(K.titles.length-1,Math.floor((lv-1)/2))],pet=K.pet[Math.min(K.pet.length-1,lv-1)],ti=todayIdx(),done=0,n=K.chores.length,msg=sayFor(cur);
 document.body.className=K.cls;
 var tl='';
 K.chores.forEach(function(c,i){var on=st.chores[ti+'-'+i];if(on)done++;tl+='<button class="tile'+(on?' on':'')+'" data-a="chore" data-id="'+ti+'-'+i+'" aria-pressed="'+!!on+'"><span>'+c[0]+'</span>'+esc(c[1])+(on?'<em>✔</em>':'')+'</button>'});
 var all=done==n,op=st.opened[ti];
 tl+=(all&&!op)?'<button class="tile wig" data-a="chest" style="background:var(--ac2);color:#111"><span>'+K.cico+'</span>Open '+K.chest+'!</button>':'<div class="tile cht"><span>'+(op?'📭':'🔒')+'</span>'+(op?'Opened':K.chest)+'</div>';
 var tc=(n+1)>8?3:4,kl='';
 K.goals.forEach(function(g,i){kl+='<div class="kr"><span class="ic">'+g[0]+'</span><span class="t">'+esc(g[1])+'</span><span class="n">'+st.stars[i]+'</span><button class="btn go" data-a="star" data-i="'+i+'" aria-label="Add star: '+esc(g[1])+'">+⭐</button><button class="btn mn" data-a="unstar" data-i="'+i+'" aria-label="Remove a star">−</button></div>'});
 var h='<div class="hdr"><button class="back" data-a="home" aria-label="Switch child">‹</button><span class="pet">'+pet+'</span><div class="hm"><div class="hf nm">'+K.name+' · Lv '+lv+'</div><div class="xp"><i style="width:'+(X%100)+'%"></i></div><div class="msg">'+esc(msg)+'</div></div><div class="pill">⭐ '+stars(cur)+'</div><div class="pill">$'+money(cur).toFixed(2)+'</div><button class="back" data-a="voice" aria-label="Voice on or off">'+(VOICE?'🔊':'🔇')+'</button></div>'+
 '<div class="split"><section class="sec"><h2><span>'+K.ci+' CHORES</span><span>'+done+'/'+n+'</span></h2><div class="tiles" style="grid-template-columns:repeat('+tc+',1fr);grid-template-rows:repeat('+Math.ceil((n+1)/tc)+',1fr)">'+tl+'</div></section><section class="sec kind"><h2><span>💖 KINDNESS</span><span>⭐ '+stars(cur)+'</span></h2><div class="kl">'+kl+'</div></section></div>'+
 '<div class="nav"><button class="back" data-a="tab" data-t="prizes">🎁 Prizes</button><button class="back" data-a="tab" data-t="badges">🏅 Badges</button><button class="back" data-a="tab" data-t="grown">⚙️ Grown-ups</button></div>';
 if(tab!='main'){
  var c='',ttl={prizes:'Prizes',badges:'Badges',grown:'Grown-ups'}[tab];
  if(tab=='prizes'){var s=stars(cur);c='<div class="panel"><div class="hf" style="font-size:13px">Star card: '+Math.min(s,70)+' / 70</div><div class="bar">';
   for(var i=1;i<=70;i++)c+='<i class="'+(i<=s?'f':'')+'"></i>';
   c+='</div><div class="rw">';K.rewards.forEach(function(r,i){var need=r[2],ok=s>=need,cl=st.claimed[i];
    c+='<div class="'+(ok&&!cl?'ok':'')+'"><span class="e '+(ok?'':'lk')+'">'+r[0]+'</span>'+need+' stars<br>'+esc(r[1])+'<br>'+(cl?'✅ Claimed':ok?'<button class="btn go" data-a="claim" data-i="'+i+'">Claim!</button>':'🔒')+'</div>'});
   c+='</div>'+(s>=70&&K.rewards.every(function(r,i){return st.claimed[i]})?'<p><button class="btn go" data-a="newcard">Start a new star card</button></p>':'')+'</div>'}
  else if(tab=='badges'){c='<div class="panel"><div class="badges">'+badgeDefs(cur).map(function(b){return '<div class="bd'+(st.bd[b[1]]?'':' lk')+'"><span>'+b[0]+'</span>'+b[1]+'</div>'}).join('')+'</div></div><div class="panel" style="margin-top:10px"><div class="hf" style="font-size:13px">Sticker book</div><div class="stk">'+(st.stickers.length?st.stickers.join(' '):'Open daily chests to collect stickers!')+'</div></div>'}
  else{c='<div class="panel"><table><tr><th></th>'+DAYS.map(function(d,i){return '<th class="'+(i==ti?'today':'')+'">'+d+'</th>'}).join('')+'</tr>';
   K.chores.forEach(function(ch,i){c+='<tr><td class="lbl">'+ch[0]+' '+esc(ch[1])+'</td>';for(var d=0;d<7;d++){var on=st.chores[d+'-'+i];c+='<td><button class="box'+(on?' on':'')+(d>ti&&!on?' dis':'')+'" data-a="chore" data-id="'+d+'-'+i+'" aria-label="'+esc(ch[1])+' '+DAYS[d]+'" aria-pressed="'+!!on+'"></button></td>'}c+='</tr>'});
   c+='</table></div><div class="panel jar" style="margin-top:10px"><span class="j">🍯</span><div class="g"><div class="hf" style="font-size:12px">Savings jar</div><div class="bar" style="margin:6px 0">'+jarBar(cur)+'</div>$'+money(cur).toFixed(2)+' of $'+st.goal.toFixed(2)+'</div><button class="btn" data-a="pay">Cash out</button></div><div class="foot"><button class="back" data-a="week">New week (clear chores)</button><button class="back" data-a="coin">Set coin value</button><button class="back" data-a="goal">Set jar goal</button></div>'}
  h+='<div class="ov"><div class="ovh"><button class="btn go" data-a="tab" data-t="main">✖ Close</button><span class="hf">'+ttl+'</span></div><div class="ovb">'+c+'</div></div>';
 }
 app.innerHTML=h;
}
function jarBar(k){var p=Math.min(10,Math.floor(10*money(k)/S[k].goal)),o='';for(var i=0;i<10;i++)o+='<i class="'+(i<p?'f':'')+'"></i>';return o}
document.getElementById('app').addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,st=cur&&S[cur];
 if(a=='pick'){cur=b.dataset.k;tab='main'}
 else if(a=='home'){cur=null}
 else if(a=='tab'){tab=b.dataset.t}
 else if(a=='chore'){var id=b.dataset.id,before=Math.floor(xp(cur)/100);
  if(st.chores[id]){delete st.chores[id];beep(200)}else{st.chores[id]=1;beep(660);burst(e,KIDS[cur].unitIc);speak(cheer());
   if(Math.floor(xp(cur)/100)>before)toast('Level up! You\u2019re now level '+(Math.floor(xp(cur)/100)+1))}
  save();var sc=window.scrollX;}
 else if(a=='star'){var before=Math.floor(xp(cur)/100);st.stars[+b.dataset.i]++;beep(880);burst(e,'⭐');speak('Kind star! Well done '+KIDS[cur].name);
  if(Math.floor(xp(cur)/100)>before)toast('Level up!');
  if([10,20,30,40,50,60,70].indexOf(stars(cur))>-1)toast('Reward unlocked! Check Rewards');}
 else if(a=='unstar'){var i=+b.dataset.i;if(st.stars[i]>0)st.stars[i]--}
 else if(a=='voice'){VOICE=!VOICE;try{localStorage.setItem('cq-voice',VOICE?1:0)}catch(x){}}
 else if(a=='chest'){var tc=todayIdx();if(!st.opened[tc]){st.opened[tc]=1;var pl=KIDS[cur].stk,sk=pl[Math.floor(Math.random()*pl.length)];st.stickers.push(sk);st.xb=(st.xb||0)+25;burst(e,sk);wow(sk,'You won a sticker and 25 XP!')}}
 else if(a=='claim'){st.claimed[+b.dataset.i]=1;burst(e,'🎉');beep(990);toast('Reward claimed!')}
 else if(a=='newcard'){st.stars=[0,0,0,0,0];st.claimed=[0,0,0,0,0,0,0]}
 else if(a=='pay'){var m=money(cur),kk=cur;if(m>0)dlg('Cash out $'+m.toFixed(2)+'?',null,function(){S[kk].paid+=m;save();render()})}
 else if(a=='week'){var kw=cur;dlg('Clear all chore ticks for a new week? XP and money earned stay banked.',null,function(){var q=S[kw];q.xb=(q.xb||0)+chk(kw)*10+perfect(kw)*20;q.xpBank+=chk(kw)*q.coinVal;q.chores={};q.opened={};save();render();toast('Fresh week started!')})}
 else if(a=='coin'){var kc=cur;dlg('Money per chore ($)',st.coinVal,function(x){var v=parseFloat(x);if(v>=0){S[kc].coinVal=v;save();render()}})}
 else if(a=='goal'){var kg=cur;dlg('Jar goal ($)',st.goal,function(x){var g=parseFloat(x);if(g>0){S[kg].goal=g;save();render()}})}
 if(cur)award(cur);save();render();
});
render();
if(window.claude&&claude.use){claude.use('db').then(function(db){
 if(!db){setSync('Saved on this device only');return}
 DB=db;setSync('Connecting…');
 ['heath','fletcher'].forEach(function(k){
  var t=setTimeout(function(){setSync('Can\u2019t reach the cloud yet – saved on this device')},10000);
  db.doc('quest/'+k).onSnapshot(function(snap){
   if(snap.metadata.hasPendingWrites)return;
   if(snap.exists){clearTimeout(t);S[k]=Object.assign(fresh(),JSON.parse(JSON.stringify(snap.data())));try{localStorage.setItem('chorequest-v1',JSON.stringify(S))}catch(e){}setSync('☁️ Synced');render()}
   else if(!snap.metadata.fromCache){clearTimeout(t);push(k);setSync('☁️ Synced')}
  },function(){clearTimeout(t);setSync('Saved on this device only')});
 });
}).catch(function(){setSync('Saved on this device only')})}
</script>
</body>
